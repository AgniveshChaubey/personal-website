<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Main">
      {{- range site.Menus.main }}
        {{- if $.IsMenuCurrent "main" . }}
      <a href="{{ .URL }}" aria-current="page">{{ .Name }}</a>
        {{- else if $.HasMenuCurrent "main" . }}
      <a href="{{ .URL }}" class="is-current">{{ .Name }}</a>
        {{- else }}
      <a href="{{ .URL }}">{{ .Name }}</a>
        {{- end }}
      {{- end }}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch light or dark theme" title="Switch light or dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4.25"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </div>
</header>
