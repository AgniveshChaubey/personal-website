baseURL: "https://agnivesh.in/"
languageCode: "en"
title: "Agnivesh Chaubey"

enableRobotsTXT: true

# Show tags as written in each post ("cache-invalidation", not "Cache-Invalidation").
capitalizeListTitles: false

minify:
  minifyOutput: true

params:
  author: "Agnivesh Chaubey"
  # Shown under your name on the home page.
  role: "Platform and infrastructure engineer"
  # Shown in the author box at the end of every post.
  bio: "Platform and infrastructure engineer. Maintainer and Google Summer of Code mentor at JSON Schema."
  # Used for search results and link previews when a page has no description of its own.
  description: "Agnivesh Chaubey is a platform and infrastructure engineer, and a maintainer and Google Summer of Code mentor at JSON Schema."
  email: "agniveshvapi@gmail.com"
  # Your portrait (in assets/). Used on the home page, in post bylines, and in link previews.
  image: "avatar.png"
  # Your X handle, for link previews on X.
  x: "sudoAgni"
  social:
    - name: GitHub
      url: "https://github.com/AgniveshChaubey"
    - name: LinkedIn
      url: "https://www.linkedin.com/in/agniveshchaubey"
    - name: X
      url: "https://x.com/sudoAgni"

menus:
  main:
    - name: Writing
      pageRef: /posts
      weight: 10
    - name: Projects
      pageRef: /projects
      weight: 20
    - name: About
      pageRef: /about
      weight: 30

markup:
  highlight:
    # Emit CSS classes so code colors can follow light and dark mode (see assets/css/main.css).
    noClasses: false
  # The "On this page" list on long posts.
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
